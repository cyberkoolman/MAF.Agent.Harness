<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
  <title id="title">Agent workflow versus Agent Harness Venn diagram</title>
  <desc id="description">A Venn diagram comparing agent workflow responsibilities, shared agentic-system concerns, and Agent Harness runtime capabilities.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef3fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172b4d" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 42px "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .subtitle { font: 400 21px "Segoe UI", Arial, sans-serif; fill: #526581; }
      .circle-title { font: 700 29px "Segoe UI", Arial, sans-serif; fill: #ffffff; letter-spacing: 0.5px; }
      .section-title { font: 700 24px "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .item { font: 500 20px "Segoe UI", Arial, sans-serif; fill: #ffffff; }
      .shared-item { font: 600 19px "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .footer { font: 600 22px "Segoe UI", Arial, sans-serif; fill: #324a6d; }
      .badge { font: 700 16px "Segoe UI", Arial, sans-serif; fill: #ffffff; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect width="1400" height="900" rx="28" fill="url(#background)"/>

  <text x="700" y="68" text-anchor="middle" class="title">Agent Workflow vs. Agent Harness</text>
  <text x="700" y="103" text-anchor="middle" class="subtitle">Different responsibilities, shared execution concerns, stronger together</text>

  <g filter="url(#shadow)">
    <circle cx="500" cy="465" r="320" fill="#2f6fed" fill-opacity="0.82" stroke="#2057c7" stroke-width="4"/>
    <circle cx="900" cy="465" r="320" fill="#10a37f" fill-opacity="0.82" stroke="#087d62" stroke-width="4"/>
  </g>

  <rect x="295" y="151" width="240" height="42" rx="21" fill="#2057c7"/>
  <text x="415" y="179" text-anchor="middle" class="badge">WORKFLOW ONLY</text>

  <rect x="865" y="151" width="240" height="42" rx="21" fill="#087d62"/>
  <text x="985" y="179" text-anchor="middle" class="badge">HARNESS ONLY</text>

  <rect x="610" y="222" width="180" height="42" rx="21" fill="#6548a8"/>
  <text x="700" y="250" text-anchor="middle" class="badge">INTERSECTION</text>

  <text x="365" y="235" text-anchor="middle" class="circle-title">Agent Workflow</text>
  <text x="1035" y="235" text-anchor="middle" class="circle-title">Agent Harness</text>

  <g>
    <text x="260" y="317" class="section-title">Defines the process</text>
    <circle cx="270" cy="358" r="5" fill="#ffffff"/>
    <text x="288" y="365" class="item">Business or task sequence</text>
    <circle cx="270" cy="408" r="5" fill="#ffffff"/>
    <text x="288" y="415" class="item">Branching and routing</text>
    <circle cx="270" cy="458" r="5" fill="#ffffff"/>
    <text x="288" y="465" class="item">Step and handoff order</text>
    <circle cx="270" cy="508" r="5" fill="#ffffff"/>
    <text x="288" y="515" class="item">Domain checkpoints</text>
    <circle cx="270" cy="558" r="5" fill="#ffffff"/>
    <text x="288" y="565" class="item">Terminal process state</text>
    <circle cx="270" cy="608" r="5" fill="#ffffff"/>
    <text x="288" y="615" class="item">Human and service steps</text>
  </g>

  <g>
    <text x="1030" y="317" text-anchor="middle" class="section-title">Manages agent execution</text>
    <circle cx="920" cy="358" r="5" fill="#ffffff"/>
    <text x="938" y="365" class="item">Session and history</text>
    <circle cx="920" cy="408" r="5" fill="#ffffff"/>
    <text x="938" y="415" class="item">Context compaction</text>
    <circle cx="920" cy="458" r="5" fill="#ffffff"/>
    <text x="938" y="465" class="item">Tool invocation pipeline</text>
    <circle cx="920" cy="508" r="5" fill="#ffffff"/>
    <text x="938" y="515" class="item">Skills, memory, and todos</text>
    <circle cx="920" cy="558" r="5" fill="#ffffff"/>
    <text x="938" y="565" class="item">Delegated-task lifecycle</text>
    <circle cx="920" cy="608" r="5" fill="#ffffff"/>
    <text x="938" y="615" class="item">Runtime limits and scopes</text>
  </g>

  <g>
    <text x="700" y="315" text-anchor="middle" class="section-title">Shared concerns</text>
    <rect x="590" y="338" width="220" height="42" rx="21" fill="#ffffff" fill-opacity="0.78"/>
    <text x="700" y="365" text-anchor="middle" class="shared-item">Agents and tasks</text>
    <rect x="590" y="392" width="220" height="42" rx="21" fill="#ffffff" fill-opacity="0.78"/>
    <text x="700" y="419" text-anchor="middle" class="shared-item">Tool-enabled steps</text>
    <rect x="590" y="446" width="220" height="42" rx="21" fill="#ffffff" fill-opacity="0.78"/>
    <text x="700" y="473" text-anchor="middle" class="shared-item">State handoff</text>
    <rect x="590" y="500" width="220" height="42" rx="21" fill="#ffffff" fill-opacity="0.78"/>
    <text x="700" y="527" text-anchor="middle" class="shared-item">Retries and correction</text>
    <rect x="590" y="554" width="220" height="42" rx="21" fill="#ffffff" fill-opacity="0.78"/>
    <text x="700" y="581" text-anchor="middle" class="shared-item">Policy and approvals</text>
    <rect x="590" y="608" width="220" height="42" rx="21" fill="#ffffff" fill-opacity="0.78"/>
    <text x="700" y="635" text-anchor="middle" class="shared-item">Observability</text>
  </g>

  <g>
    <rect x="230" y="807" width="940" height="58" rx="29" fill="#ffffff" stroke="#c5d1e3" stroke-width="2"/>
    <text x="700" y="844" text-anchor="middle" class="footer">
      Workflow decides when and where work happens; the harness manages how agent work runs.
    </text>
  </g>
</svg>
